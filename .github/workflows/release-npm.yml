name: Release

# Independent of CI (check/test). Trigger only by pushing a semver tag:
#   git tag v0.1.0 && git push origin v0.1.0
# Publishes @sxo/packing* via npm OIDC (platform .node + wasm packages included).
# Already-published npm versions are skipped (retry-safe).
# Trusted Publisher workflow filename must stay: release-npm.yml

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-engine:
    name: engine ${{ matrix.pkg }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pkg: packing-win32-x64
            node_file: pm.win32-x64-msvc.node
            lib: pm_napi.dll
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            pkg: packing-win32-arm64
            node_file: pm.win32-arm64-msvc.node
            lib: pm_napi.dll
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            pkg: packing-linux-x64
            node_file: pm.linux-x64-gnu.node
            lib: libpm_napi.so
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            pkg: packing-linux-arm64
            node_file: pm.linux-arm64-gnu.node
            lib: libpm_napi.so
          - os: macos-latest
            target: x86_64-apple-darwin
            pkg: packing-darwin-x64
            node_file: pm.darwin-x64.node
            lib: libpm_napi.dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            pkg: packing-darwin-arm64
            node_file: pm.darwin-arm64.node
            lib: libpm_napi.dylib
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross linker (linux-arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Install compilation target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build pm-napi
        run: cargo build -p pm-napi --release --target ${{ matrix.target }}
      - name: Stage native binding
        shell: bash
        run: |
          set -euo pipefail
          SRC="target/${{ matrix.target }}/release/${{ matrix.lib }}"
          DEST="projects/packages/${{ matrix.pkg }}/lib/${{ matrix.node_file }}"
          mkdir -p "$(dirname "$DEST")"
          cp "$SRC" "$DEST"
          chmod +x "$DEST" || true
          ls -la "$DEST"
      - uses: actions/upload-artifact@v7
        with:
          name: engine-${{ matrix.pkg }}
          path: projects/packages/${{ matrix.pkg }}/lib/${{ matrix.node_file }}
          if-no-files-found: error

  publish-npm:
    name: publish npm
    needs: build-engine
    runs-on: ubuntu-latest
    environment: NPM_PUBLISH
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add wasm32-unknown-unknown
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Ensure npm CLI supports OIDC
        run: |
          npm install -g npm@latest
          node -v
          npm -v
      - run: pnpm install --frozen-lockfile

      - name: Download engine artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: engine-*
          path: _engines

      - name: Build wasm artifact
        run: pnpm run build:wasm

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "expected semver tag like v1.2.3, got: $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publishing version $version (tag $tag)"

      - name: Prepare packages for publish
        env:
          INPUT_VERSION: ${{ steps.ver.outputs.version }}
        run: node scripts/prepare-npm-publish.mjs

      - run: pnpm run build:ts

      - name: Strip token-style npmrc (OIDC only)
        shell: bash
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          for f in "${HOME}/.npmrc" "${NPM_CONFIG_USERCONFIG:-}" "${RUNNER_TEMP:-}/.npmrc"; do
            [[ -n "${f}" && -f "${f}" ]] || continue
            if grep -q '_authToken' "${f}"; then
              grep -v '_authToken' "${f}" > "${f}.oidc" && mv "${f}.oidc" "${f}"
              echo "stripped _authToken from ${f}"
            fi
          done

      - name: Publish npm
        run: node scripts/publish-npm-packages.mjs

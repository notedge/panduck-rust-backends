name: Check TypeScript

# pnpm build/test against Rust-built native + wasm artifacts. Rust checks: check-rust.yml
# Publish: release-npm.yml on v*.*.* tags.
on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  typescript:
    name: pnpm packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add wasm32-unknown-unknown
      - uses: pnpm/action-setup@v6
        # version from package.json packageManager (pnpm@10.28.0)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nifty format --check
      - run: pnpm run build:napi
      - run: pnpm run build:wasm
      - run: pnpm run build:ts
      - run: pnpm --filter @sxo/packing test
